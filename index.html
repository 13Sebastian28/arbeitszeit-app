<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a84ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Arbeitszeit"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><title>Meine Arbeitszeit</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#172033;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;background:#f3f6fa}.app{max-width:520px;margin:auto;padding:18px 16px 100px}.top h1{margin:4px 0 16px}.card{background:#fff;border:1px solid #e3e8ef;border-radius:18px;padding:16px;margin-bottom:14px}.field{margin-top:10px}.field label{display:block;font-size:13px;color:#667085;margin-bottom:5px}input,select{width:100%;padding:11px;border:1px solid #ccd4df;border-radius:11px;background:#fff;font-size:16px}.row,.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.primary,.secondary{border-radius:12px;padding:12px;font-weight:700;font-size:15px}.primary{width:100%;border:0;background:#0a84ff;color:#fff;margin-top:12px}.secondary{border:1px solid #ccd4df;background:#fff;color:#172033}.muted{color:#667085;font-size:13px}.balance{font-size:30px;font-weight:800;color:#15803d}.metric{background:#f5f8fc;border-radius:11px;padding:9px}.metric b{display:block;margin-top:3px}.hidden{display:none!important}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dde3eb}.navin{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:8px}.nav button{border:0;background:transparent;padding:9px 2px;color:#687386;font-weight:700}.nav .active{color:#0a84ff}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}.toolbar b{text-align:center;flex:1}.list{display:grid;gap:6px}.item{display:grid;grid-template-columns:70px 1fr 58px 60px 55px;gap:4px;align-items:center;border:1px solid #e3e8ef;background:#fff;border-radius:11px;padding:9px 6px;text-align:left;color:inherit}.item.today{border:2px solid #0a84ff}.num{text-align:right;font-size:12px}.status{font-size:11px;color:#667085}.plus{color:#15803d}.minus{color:#c2410c}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.summary3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}.ok{color:#15803d;font-weight:700;margin-top:10px}.danger{width:100%;margin-top:14px;color:#b42318}@media(max-width:390px){.item{grid-template-columns:60px 1fr 46px 52px 48px;font-size:12px}}@media(prefers-color-scheme:dark){:root,body{background:#101318;color:#edf2f7}.card,.nav{background:#181d24;border-color:#29313b}input,select,.secondary,.item{background:#11161c;color:#edf2f7;border-color:#3a4450}.metric{background:#11161c}.muted,.field label,.status{color:#a8b2c0}}
</style></head><body><main class="app"><header class="top"><small class="muted">Arbeitszeit-App</small><h1>Meine Arbeitszeit</h1></header>
<section id="balanceCard" class="card"><h2>Überstundenkonto</h2><div id="balance" class="balance">0:00 h</div></section>
<section id="day" class="card"><h2>Tageserfassung</h2><div class="field"><label>Datum</label><input id="date" type="date"></div><div class="field"><label>Tagestyp</label><select id="type"><option>Arbeit</option><option>Urlaub</option><option>Krankheit</option><option>Feiertag</option><option>Arbeitsfrei</option></select></div><div id="holidayName" class="muted"></div><div class="field"><label>Sollzeit</label><input id="target" type="time"></div><div id="workFields"><div class="row"><div class="field"><label>Beginn</label><input id="start" type="time"></div><div class="field"><label>Ende</label><input id="end" type="time"></div></div><div class="field"><label>Pause in Minuten</label><input id="pause" type="number" min="0" max="600" value="30"></div></div><div class="summary3"><div class="metric">Netto<b id="net">0:00</b></div><div class="metric">Soll<b id="targetOut">0:00</b></div><div class="metric">+/−<b id="diff">0:00</b></div></div><button id="save" class="primary">Tag speichern</button><div id="msg" class="muted" style="margin-top:8px" aria-live="polite"></div></section>
<section id="week" class="card hidden"><div class="toolbar"><button id="pw" class="secondary">‹</button><b id="wl"></b><button id="nw" class="secondary">›</button></div><button id="tw" class="primary">Heute</button><div id="weekList" class="list" style="margin-top:10px"></div><div id="weekStats" class="stats" style="margin-top:10px"></div></section>
<section id="month" class="card hidden"><div class="toolbar"><button id="pm" class="secondary">‹</button><b id="ml"></b><button id="nm" class="secondary">›</button></div><button id="tm" class="primary">Heute</button><div id="monthStats" class="stats" style="margin:10px 0"></div><div id="monthList" class="list"></div></section>
<section id="year" class="card hidden"><div class="toolbar"><button id="py" class="secondary">‹</button><b id="yl"></b><button id="ny" class="secondary">›</button></div><button id="ty" class="primary">Heute</button><div id="yearStats" class="stats" style="margin-top:10px"></div></section>
<section id="settings" class="card hidden"><h2>Einstellungen</h2><div class="field"><label>Bundesland</label><select id="state"><option value="BW">Baden-Württemberg</option><option value="BY">Bayern</option><option value="BE">Berlin</option><option value="BB">Brandenburg</option><option value="HB">Bremen</option><option value="HH">Hamburg</option><option value="HE">Hessen</option><option value="MV">Mecklenburg-Vorpommern</option><option value="NI">Niedersachsen</option><option value="NW">Nordrhein-Westfalen</option><option value="RP">Rheinland-Pfalz</option><option value="SL">Saarland</option><option value="SN">Sachsen</option><option value="ST">Sachsen-Anhalt</option><option value="SH">Schleswig-Holstein</option><option value="TH">Thüringen</option></select></div><div id="mariaWrap" class="field"><label><input id="maria" type="checkbox" style="width:auto"> Mariä Himmelfahrt am Arbeitsort berücksichtigen</label></div><h3>Sollzeit je Wochentag</h3><div class="row" id="targets"></div><h3>Überstundenkonto</h3><div class="row"><div class="field"><label>Stand zum</label><input id="initialDate" type="date"></div><div class="field"><label>Startwert (Std:Min)</label><input id="initial" placeholder="0:00"></div></div><h3>Urlaub</h3><div class="row"><div class="field"><label>Urlaubsjahr</label><input id="vacYear" type="number" min="2000" max="2100"></div><div class="field"><label>Jahresanspruch</label><input id="vacEnt" type="number" min="0" value="30"></div><div class="field"><label>Übertrag Vorjahr</label><input id="vacCarry" type="number" min="0" value="0"></div></div><div class="actions"><button id="export" class="secondary">Daten sichern</button><label class="secondary" style="text-align:center">Backup einlesen<input id="import" type="file" accept="application/json" style="display:none"></label></div><div id="settingsMsg" class="ok" aria-live="polite"></div><button id="resetSettings" class="secondary danger">Einstellungen auf Standardwerte zurücksetzen</button></section></main>
<nav class="nav"><div class="navin"><button id="nDay" class="active">Tag</button><button id="nWeek">Woche</button><button id="nMonth">Monat</button><button id="nYear">Jahr</button><button id="nSettings">Einstellungen</button></div></nav><script>
const $=id=>document.getElementById(id), DK='arbeitszeitApp.days.v2', SK='arbeitszeitApp.settings.v2';
const baseDefaults=()=>({state:'BY',maria:false,initial:'0:00',initialDate:'',vacYear:new Date().getFullYear(),vacEnt:30,vacCarry:0,targets:{1:'08:00',2:'08:00',3:'08:00',4:'08:00',5:'06:00',6:'00:00',0:'00:00'}});const defaults=baseDefaults();
const days=()=>{try{return JSON.parse(localStorage.getItem(DK)||'{}')}catch{return {}}}, settings=()=>{try{let raw=JSON.parse(localStorage.getItem(SK)||'{}');return {...baseDefaults(),...raw,targets:{...baseDefaults().targets,...(raw.targets||{})}}}catch{return baseDefaults()}};
const mins=v=>{if(!v)return 0;let z=String(v).replace(/^[-+]/,'').split(':').map(Number);return z[0]*60+(z[1]||0)}, signed=v=>(String(v).trim().startsWith('-')?-1:1)*mins(v), fmt=n=>(n<0?'−':n>0?'+':'')+Math.floor(Math.abs(n)/60)+':'+String(Math.abs(n)%60).padStart(2,'0');
const saveSettings=()=>{let s=settings();s.state=$('state').value;s.maria=$('maria').checked;s.initial=$('initial').value||'0:00';s.initialDate=$('initialDate').value||'';s.vacYear=Math.min(2100,Math.max(2000,+$('vacYear').value||new Date().getFullYear()));s.vacEnt=Math.max(0,+$('vacEnt').value||0);s.vacCarry=Math.max(0,+$('vacCarry').value||0);document.querySelectorAll('[data-wd]').forEach(x=>s.targets[x.dataset.wd]=x.value||'00:00');localStorage.setItem(SK,JSON.stringify(s));applySettings();refreshBalance();$('settingsMsg').textContent='✓ Einstellungen gespeichert.'};
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'), today=()=>iso(new Date());
function easter(y){let a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;return new Date(y,mo-1,da)}const add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};
function holidays(y){let s=settings(),H={},p=(d,n)=>H[iso(d)]=n;[[1,1,'Neujahr'],[5,1,'Tag der Arbeit'],[10,3,'Tag der Deutschen Einheit'],[12,25,'1. Weihnachtstag'],[12,26,'2. Weihnachtstag']].forEach(x=>p(new Date(y,x[0]-1,x[1]),x[2]));let e=easter(y);p(add(e,-2),'Karfreitag');p(add(e,1),'Ostermontag');p(add(e,39),'Christi Himmelfahrt');p(add(e,50),'Pfingstmontag');if(['BW','BY','ST'].includes(s.state))p(new Date(y,0,6),'Heilige Drei Könige');if(['BE','MV'].includes(s.state))p(new Date(y,2,8),'Internationaler Frauentag');if(s.state==='BB'){p(e,'Ostersonntag');p(add(e,49),'Pfingstsonntag')}if(['BW','BY','HE','NW','RP','SL'].includes(s.state))p(add(e,60),'Fronleichnam');if(s.state==='SL'||(s.state==='BY'&&s.maria))p(new Date(y,7,15),'Mariä Himmelfahrt');if(s.state==='TH')p(new Date(y,8,20),'Weltkindertag');if(['BB','HB','HH','MV','NI','SN','ST','SH','TH'].includes(s.state))p(new Date(y,9,31),'Reformationstag');if(['BW','BY','NW','RP','SL'].includes(s.state))p(new Date(y,10,1),'Allerheiligen');if(s.state==='SN'){let x=new Date(y,10,23);while(x.getDay()!=3)x.setDate(x.getDate()-1);p(x,'Buß- und Bettag')}return H}const holiday=k=>holidays(+k.slice(0,4))[k];
function credit(d){if(['Urlaub','Krankheit','Feiertag'].includes(d.type))return mins(d.target);if(d.type!=='Arbeit'||!d.start||!d.end)return 0;return Math.max(0,mins(d.end)-mins(d.start)-(+d.pause||0))}function worked(d){return d&&d.type==='Arbeit'?credit(d):0}function totalBalance(){let s=settings(),n=signed(s.initial);Object.entries(days()).forEach(([k,d])=>{if(!s.initialDate||k>=s.initialDate)n+=credit(d)-mins(d.target)});return n}function refreshBalance(){$('balance').textContent=fmt(totalBalance())+' h';$('balance').style.color=totalBalance()<0?'#c2410c':'#15803d'}
function applySettings(){let s=settings();$('state').value=s.state;$('maria').checked=s.maria;$('mariaWrap').classList.toggle('hidden',s.state!=='BY');$('initial').value=s.initial;$('initialDate').value=s.initialDate||'';$('vacYear').value=s.vacYear;$('vacEnt').value=s.vacEnt;$('vacCarry').value=s.vacCarry;document.querySelectorAll('[data-wd]').forEach(x=>x.value=s.targets[x.dataset.wd]||'00:00')}
['Mo','Di','Mi','Do','Fr','Sa','So'].forEach((n,i)=>{let wd=(i+1)%7,d=document.createElement('div');d.className='field';d.innerHTML='<label>'+n+'</label><input type="time" data-wd="'+wd+'">';$('targets').appendChild(d)});
function typeUI(){$('workFields').classList.toggle('hidden',$('type').value!=='Arbeit')}function calc(){let d={type:$('type').value,target:$('target').value,start:$('start').value,end:$('end').value,pause:$('pause').value},c=credit(d);$('net').textContent=fmt(d.type==='Arbeit'?c:0).replace('+','');$('targetOut').textContent=fmt(mins(d.target)).replace('+','');$('diff').textContent=fmt(c-mins(d.target));typeUI()}
function loadDay(){let k=$('date').value,d=days()[k],s=settings(),dt=new Date(k+'T12:00:00');$('msg').textContent='';if(d){for(let x of ['type','target','start','end','pause'])$(x).value=d[x]??'';$('msg').textContent='Gespeicherter Tag geladen.'}else{$('type').value=holiday(k)?'Feiertag':'Arbeit';$('target').value=s.targets[dt.getDay()]||'00:00';$('start').value='';$('end').value='';$('pause').value=30}let h=holiday(k);$('holidayName').textContent=h?'Feiertag: '+h:'';calc()}
function saveDay(){let k=$('date').value;if(!k)return;if($('type').value==='Arbeit'){if(!$('start').value||!$('end').value){$('msg').textContent='Beginn und Ende müssen ausgefüllt sein.';return}let span=mins($('end').value)-mins($('start').value),pa=+$('pause').value||0;if(span<=0){$('msg').textContent='Arbeitsende muss nach Arbeitsbeginn liegen.';return}if(pa>=span){$('msg').textContent='Pause darf nicht so lang wie die Anwesenheitszeit sein.';return}if(span-pa>960&&!confirm('Nettoarbeitszeit über 16 Stunden. Trotzdem speichern?'))return}let all=days();all[k]={type:$('type').value,target:$('target').value,start:$('start').value,end:$('end').value,pause:+$('pause').value||0,updatedAt:new Date().toISOString()};localStorage.setItem(DK,JSON.stringify(all));$('msg').textContent='Gespeichert.';refreshBalance();calc()}
function eff(k){let d=days()[k];if(d)return d;let h=holiday(k);return h?{type:'Feiertag',target:'00:00',auto:h}:null}function item(k,d,label){let c=d?credit(d):0,delta=d&&k<=today()?c-mins(d.target):0,b=document.createElement('button');b.className='item'+(k===today()?' today':'');b.innerHTML='<b>'+label+'</b><span class="status">'+(d?(d.auto||d.type):(k>today()?'Offen':'Nicht erfasst'))+'</span><span class="num">'+(d?fmt(mins(d.target)).replace('+',''):'–')+'</span><span class="num">'+(d?fmt(c).replace('+',''):'–')+'</span><span class="num '+(delta>0?'plus':delta<0?'minus':'')+'">'+(d&&k<=today()?fmt(delta):'–')+'</span>';b.onclick=()=>{$('date').value=k;loadDay();show('day')};return b}
let wa=new Date(),ma=new Date(),ya=new Date();function monday(d){let x=new Date(d),n=x.getDay()||7;x.setDate(x.getDate()-n+1);return x}function weekNo(d){let x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));let y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}
function renderWeek(){let m=monday(wa),list=$('weekList'),T=0,C=0,D=0;list.innerHTML='';$('wl').textContent='KW '+weekNo(m);for(let i=0;i<7;i++){let x=new Date(m);x.setDate(m.getDate()+i);let k=iso(x),d=eff(k);if(d){T+=mins(d.target);C+=credit(d);if(k<=today())D+=credit(d)-mins(d.target)}list.appendChild(item(k,d,['Mo','Di','Mi','Do','Fr','Sa','So'][i]+' '+x.getDate()+'.'+(x.getMonth()+1)+'.'))}$('weekStats').innerHTML='<div class="metric">Soll<b>'+fmt(T).replace('+','')+' h</b></div><div class="metric">Angerechnet<b>'+fmt(C).replace('+','')+' h</b></div><div class="metric">Differenz<b>'+fmt(D)+' h</b></div><div class="metric">Gesamtkonto<b>'+fmt(totalBalance())+' h</b></div>'}
function renderMonth(){let y=ma.getFullYear(),m=ma.getMonth(),last=new Date(y,m+1,0).getDate(),T=0,W=0,C=0,D=0,counts={Urlaub:0,Krankheit:0,Feiertag:0,Arbeitsfrei:0};$('ml').textContent=new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'}).format(ma);$('monthList').innerHTML='';for(let i=1;i<=last;i++){let x=new Date(y,m,i),k=iso(x),d=eff(k);if(d){T+=mins(d.target);W+=worked(d);C+=credit(d);if(k<=today())D+=credit(d)-mins(d.target);if(counts[d.type]!=null)counts[d.type]++}$('monthList').appendChild(item(k,d,x.getDate()+'.'+(m+1)+'.'))}$('monthStats').innerHTML='<div class="metric">Soll<b>'+fmt(T).replace('+','')+' h</b></div><div class="metric">Gearbeitet<b>'+fmt(W).replace('+','')+' h</b></div><div class="metric">Angerechnet<b>'+fmt(C).replace('+','')+' h</b></div><div class="metric">Differenz<b>'+fmt(D)+' h</b></div><div class="metric">Urlaub<b>'+counts.Urlaub+'</b></div><div class="metric">Krank<b>'+counts.Krankheit+'</b></div><div class="metric">Feiertage<b>'+counts.Feiertag+'</b></div><div class="metric">Arbeitsfrei<b>'+counts.Arbeitsfrei+'</b></div>'}
function renderYear(){let y=ya.getFullYear(),T=0,W=0,C=0,D=0,V=0;Object.entries(days()).forEach(([k,d])=>{if(+k.slice(0,4)!==y)return;T+=mins(d.target);W+=worked(d);C+=credit(d);if(k<=today())D+=credit(d)-mins(d.target);if(d.type==='Urlaub')V++});let s=settings(),available=(s.vacYear===y?s.vacEnt+s.vacCarry:s.vacEnt);$('yl').textContent=y;$('yearStats').innerHTML='<div class="metric">Soll<b>'+fmt(T).replace('+','')+' h</b></div><div class="metric">Gearbeitet<b>'+fmt(W).replace('+','')+' h</b></div><div class="metric">Angerechnet<b>'+fmt(C).replace('+','')+' h</b></div><div class="metric">Differenz<b>'+fmt(D)+' h</b></div><div class="metric">Urlaub genommen<b>'+V+'</b></div><div class="metric">Urlaub verfügbar<b>'+available+'</b></div><div class="metric">Resturlaub<b>'+Math.max(0,available-V)+'</b></div>'}
function show(v){['day','week','month','year','settings'].forEach(x=>$(x).classList.toggle('hidden',x!==v));$('balanceCard').classList.toggle('hidden',v!=='day');[['nDay','day'],['nWeek','week'],['nMonth','month'],['nYear','year'],['nSettings','settings']].forEach(x=>$(x[0]).classList.toggle('active',x[1]===v));if(v==='week')renderWeek();if(v==='month')renderMonth();if(v==='year')renderYear();if(v==='settings'){$('settingsMsg').textContent='';applySettings()}}
function exportData(){let blob=new Blob([JSON.stringify({version:3,days:days(),settings:settings()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Arbeitszeit-Backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);$('settingsMsg').textContent='✓ Backup erstellt.'}async function importData(e){try{let x=JSON.parse(await e.target.files[0].text());if(!x.days||!x.settings)throw 0;localStorage.setItem(DK,JSON.stringify(x.days));localStorage.setItem(SK,JSON.stringify(x.settings));applySettings();loadDay();refreshBalance();$('settingsMsg').textContent='✓ Backup erfolgreich eingelesen.'}catch{$('settingsMsg').textContent='Backup ungültig.'}e.target.value=''}
function resetSettings(){if(!confirm('Nur die Einstellungen auf Standardwerte zurücksetzen? Gespeicherte Arbeitszeittage bleiben erhalten.'))return;localStorage.setItem(SK,JSON.stringify(baseDefaults()));applySettings();refreshBalance();$('settingsMsg').textContent='✓ Einstellungen zurückgesetzt. Arbeitszeitdaten wurden nicht gelöscht.'}
$('date').value=today();applySettings();loadDay();refreshBalance();['type','target','start','end','pause'].forEach(x=>$(x).addEventListener('input',calc));$('date').onchange=loadDay;$('save').onclick=saveDay;$('state').onchange=saveSettings;$('maria').onchange=saveSettings;$('initial').onchange=saveSettings;$('initialDate').onchange=saveSettings;$('vacYear').onchange=saveSettings;$('vacEnt').onchange=saveSettings;$('vacCarry').onchange=saveSettings;document.querySelectorAll('[data-wd]').forEach(x=>x.onchange=saveSettings);$('export').onclick=exportData;$('import').onchange=importData;$('resetSettings').onclick=resetSettings;$('nDay').onclick=()=>show('day');$('nWeek').onclick=()=>show('week');$('nMonth').onclick=()=>show('month');$('nYear').onclick=()=>show('year');$('nSettings').onclick=()=>show('settings');$('pw').onclick=()=>{wa.setDate(wa.getDate()-7);renderWeek()};$('nw').onclick=()=>{wa.setDate(wa.getDate()+7);renderWeek()};$('tw').onclick=()=>{wa=new Date();renderWeek()};$('pm').onclick=()=>{ma=new Date(ma.getFullYear(),ma.getMonth()-1,1);renderMonth()};$('nm').onclick=()=>{ma=new Date(ma.getFullYear(),ma.getMonth()+1,1);renderMonth()};$('tm').onclick=()=>{ma=new Date();renderMonth()};$('py').onclick=()=>{ya=new Date(ya.getFullYear()-1,0,1);renderYear()};$('ny').onclick=()=>{ya=new Date(ya.getFullYear()+1,0,1);renderYear()};$('ty').onclick=()=>{ya=new Date();renderYear()};
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
</script></body></html>
